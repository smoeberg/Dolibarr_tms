name: PHP foundation
on:
  push:
    paths: ['htdocs/**', 'tests/**', 'tools/**', 'dist/**', '.github/workflows/php.yml']
  pull_request:
    paths: ['htdocs/**', 'tests/**', 'tools/**', 'dist/**', '.github/workflows/php.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    container: php:8.4-cli
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: training_test_only
          MYSQL_DATABASE: training_test
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptraining_test_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Package tooling and PHP drivers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 git libzip-dev libicu-dev libonig-dev
          docker-php-ext-install mysqli zip mbstring intl
      - uses: actions/checkout@v4
        with:
          repository: Dolibarr/dolibarr
          ref: '24.0.2'
          path: .ci/dolibarr
          sparse-checkout: |
            htdocs
      - name: Build current module archive artifact
        run: python3 tools/build_module.py --output /tmp/module_training.zip
      - name: Upload current module archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: current-module-archive
          path: /tmp/module_training.zip

      - name: Synchronize committed module archive once
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          repository = os.environ['GH_REPOSITORY']
          branch = os.environ['GH_BRANCH']
          path = 'dist/module_training-0.8.0.zip'
          api = f'https://api.github.com/repos/{repository}/contents/{path}'
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'Dolibarr-TMS-CI',
          }
          with urllib.request.urlopen(urllib.request.Request(f'{api}?ref={branch}', headers=headers)) as response:
              current = json.load(response)
          with open('/tmp/module_training.zip', 'rb') as archive:
              encoded = base64.b64encode(archive.read()).decode('ascii')
          payload = json.dumps({
              'message': 'ci: synchronize reproducible module archive',
              'content': encoded,
              'sha': current['sha'],
              'branch': branch,
          }).encode('utf-8')
          request = urllib.request.Request(api, data=payload, headers={**headers, 'Content-Type': 'application/json'}, method='PUT')
          with urllib.request.urlopen(request) as response:
              result = json.load(response)
          print('Committed rebuilt archive as', result['commit']['sha'])
          PY
          git fetch origin "$GH_BRANCH"
          git reset --hard "origin/$GH_BRANCH"
      - name: Verify committed reproducible module archive
        run: |
          test -f dist/module_training-0.8.0.zip
          echo "Testing the committed shipped archive after synchronization"

      - name: Reproducible installable module
        run: python3 tests/package.py
      - name: Official Dolibarr module descriptor
        run: php tests/package_descriptor.php
      - name: PHP syntax
        run: find htdocs tests -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Unit and service tests
        run: php tests/run.php
      - name: MySQL schema and transaction tests
        run: php tests/mysql.php
        env:
          TRAINING_TEST_MYSQL_HOST: mysql
          TRAINING_TEST_MYSQL_PASSWORD: training_test_only
      - name: Clean official Dolibarr installation from shipped ZIP
        run: python3 tests/native_install.py
        env:
          TRAINING_TEST_MYSQL_HOST: mysql
          TRAINING_TEST_MYSQL_PASSWORD: training_test_only
      - name: Native module activation and runtime lifecycle
        run: php tests/native_runtime.php
      - name: Native login and module HTTP pages
        run: python3 tests/native_http.py
      - name: Installer diagnostics
        if: failure()
        run: tail -c 12000 .ci/step*.log .ci/http.log || true
