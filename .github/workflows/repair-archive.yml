name: One-time archive repair
on:
  push:
    paths:
      - .github/workflows/repair-archive.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download deterministic archive from validation run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/archive
          gh run download 37591649797 --repo "$GITHUB_REPOSITORY" --name current-module-archive --dir /tmp/archive
          test -f /tmp/archive/module_training.zip
      - name: Commit archive and remove repair workflow
        run: |
          cp /tmp/archive/module_training.zip dist/module_training-0.8.0.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/module_training-0.8.0.zip
          git rm .github/workflows/repair-archive.yml
          git commit -m 'Fix deterministic module archive'
          git push
